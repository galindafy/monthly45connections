<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connections Monthly 45x45</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="container">
<header>
<h1>Connections</h1>
<p id="puzzle"></p>
<p id="resetDate" class="reset-date"></p>
</header>

<section class="topbar" aria-label="Puzzle controls">
<div class="stat"><span>Score</span><strong id="score">0</strong></div>
<div class="stat"><span>Mistakes</span><strong id="mistakes">0</strong></div>
<button id="shuffleBtn" type="button">Shuffle</button>
<button id="deselectBtn" type="button">Deselect</button>
<button id="resetBtn" type="button">Reset</button>
</section>

<section class="selection-bar" aria-label="Selected group">
<div class="selection-summary">
<span>Selected</span>
<strong id="selectedSummary">No tile selected</strong>
</div>
</section>

<section class="goal">
<strong>Make 45 groups of 45</strong>
<span id="progress">0 / 45 groups complete</span>
</section>

<div id="status" class="status" role="status" aria-live="polite"></div>
<section id="board" class="board" aria-label="Puzzle board"></section>
</main>

<div id="shareModal" class="share-modal" hidden>
<section class="share-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
<button id="closeShareBtn" class="share-close" type="button" aria-label="Close share popup">&times;</button>
<h2 id="shareTitle">Puzzle Complete</h2>
<p id="shareStats"></p>
<textarea id="shareText" readonly rows="5"></textarea>
<button id="copyShareBtn" type="button">Copy Share</button>
</section>
</div>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
